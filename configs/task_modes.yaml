default_task_mode: system_recovery_priority

task_modes:
  communication_priority:
    description: Prioritize communication network restoration to improve coordination.
    target_metrics:
      - communication_recovery_ratio
      - constraint_violation_count
  critical_load_priority:
    description: Prioritize restoration of critical loads (hospitals, water, emergency services).
    target_metrics:
      - critical_load_recovery_ratio
      - success_rate
  system_recovery_priority:
    description: Balance communication, power, and transportation restoration.
    target_metrics:
      - success_rate
      - recovery_completion_time
      - resource_utilization
  stabilization_priority:
    description: Minimize violations and stabilize operations in late-stage recovery.
    target_metrics:
      - constraint_violation_count
      - recovery_completion_time

selection:
  score_metric: success_rate
  higher_is_better: true
