llm:
  default_mode: auto
  timeout_seconds: 45
  max_retries: 2
  temperature: 0.3
  max_tokens: 1400
  base_url_env: DEEPSEEK_BASE_URL
  model_env: DEEPSEEK_MODEL
  api_key_env: DEEPSEEK_API_KEY

outer_loop:
  rounds: 2
  candidates_per_round: 2
  feedback_top_k: 2

prompts:
  system_prompt: prompts/system_prompt.txt
  codegen_prompt: prompts/codegen_prompt.txt
  router_prompt: prompts/router_prompt.txt
  feedback_prompt: prompts/feedback_prompt.txt

paths:
  generated_dir: generated
  outputs_dir: outputs
