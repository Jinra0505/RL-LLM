llm:
  base_url: https://api.deepseek.com
  model_chat: deepseek-chat
  model_reasoner: deepseek-reasoner
  timeout_seconds: 45
  max_retries: 2
  temperature: 0.3
  max_tokens: 1800

outer_loop:
  rounds: 1
  candidates_per_round: 2

scenario:
  severity: moderate  # mild | moderate | severe

env:
  name: project_recovery
  max_steps: 60
  topology:
    zones: [A, B, C]
    backbone_nodes: [P0, C0, R0]
  action_names:
    0: road_A
    1: road_B
    2: road_C
    3: power_A
    4: power_B
    5: power_C
    6: comm_A
    7: comm_B
    8: comm_C
    9: mes_to_A
    10: mes_to_B
    11: mes_to_C
    12: feeder_reconfigure
    13: coordinated_balanced

training:
  train_episodes: 140
  eval_episodes: 16
  gamma: 0.98
  batch_size: 64
  replay_size: 30000
  min_replay_size: 500
  train_freq: 1
  target_update_interval: 250
  learning_rate: 0.0008
  hidden_dim: 128
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 5000

selection:
  higher_is_better: true
  task_mode_metric_weights:
    road_opening_priority:
      road_recovery_ratio: 0.45
      success_rate: 0.2
      constraint_violation_rate_eval: -0.15
      cumulative_reward_mean: 0.2
    critical_power_priority:
      power_recovery_ratio: 0.5
      critical_load_recovery_ratio: 0.3
      success_rate: 0.2
    backbone_comm_priority:
      communication_recovery_ratio: 0.5
      backbone_comm_ratio: 0.25
      success_rate: 0.2
      constraint_violation_rate_eval: -0.1
    coordinated_restoration:
      success_rate: 0.35
      communication_recovery_ratio: 0.2
      power_recovery_ratio: 0.2
      road_recovery_ratio: 0.15
      critical_load_recovery_ratio: 0.1
    stabilization_priority:
      success_rate: 0.25
      constraint_violation_rate_eval: -0.45
      cumulative_reward_mean: 0.2
      critical_load_recovery_ratio: 0.1

reward_weights:
  delta_power: 0.20
  delta_comm: 0.20
  delta_road: 0.15
  delta_critical_load: 0.20
  synergy_bonus: 0.10
  constraint_penalty: 0.08
  action_switch_penalty: 0.04
  mes_overuse_penalty: 0.03

task_modes:
  default: coordinated_restoration
  allowed:
    - road_opening_priority
    - critical_power_priority
    - backbone_comm_priority
    - coordinated_restoration
    - stabilization_priority

paths:
  generated_dir: generated
  outputs_dir: outputs
